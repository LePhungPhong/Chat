<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Mediasoup - Fixed Require/JSON/Module</title>
    
    <!-- Polyfill process manual (no module fail) -->
    <script>
        window.process = window.process || { env: { NODE_ENV: 'development' }, version: 'v18.0.0', cwd: () => '/', nextTick: cb => Promise.resolve().then(cb) };
    </script>
    
    <!-- Buffer UMD -->
    <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.js"></script>
    <script>window.Buffer = window.Buffer || buffer.Buffer;</script>
    
    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- Importmap JSON sạch (v2.15.0, esm.sh) -->
    <script type="importmap">
    {
      "imports": {
        "mediasoup-client": "https://esm.sh/mediasoup-client@3.18.0",
        "sdp-transform": "https://esm.sh/sdp-transform@2.15.0",
        "events": "https://esm.sh/events@3.3.0",
        "events-alias": "https://esm.sh/events@3.3.0"
      }
    }
    </script>
    
    <style>
        video { width: 320px; height: 240px; border: 1px solid #ccc; margin: 10px; }
        button { padding: 10px; margin: 10px; background: #28a745; color: white; border: none; cursor: pointer; }
        #log { max-height: 200px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; font-family: monospace; background: #f8f9fa; }
    </style>
</head>
<body>
    <h1>Test WebRTC Mediasoup (Fixed: No require/JSON errors)</h1>
    <div>
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <button id="startBtn">Bắt đầu Test</button>
    <div id="log"></div>
    
    <script type="module">
        // Imports (thay require ở index.js:11)
        import * as mediasoupClient from 'mediasoup-client';
        import * as sdpTransform from 'sdp-transform';
        import { EventEmitter } from 'events-alias';
        
        const { Device, detectDevice } = mediasoupClient;
        const socket = io();
        const logEl = document.getElementById('log');
        let earlyExit = false;
        
        const log = (msg) => {
            const p = document.createElement('p');
            p.textContent = `${new Date().toLocaleTimeString()}: ${msg}`;
            logEl.appendChild(p);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        };
        
        // Test Buffer
        try {
            const buf = Buffer.from('No require!');
            log('✅ Buffer OK: ' + buf.toString('utf8'));
        } catch (err) { log('❌ Buffer: ' + err.message); }
        
        // Test SDP (v2.15.0)
        try {
            const sdp = 'v=0\r\no=- 123 2 IN IP4 127.0.0.1\r\ns=-\r\nt=0 0\r\nm=audio 9 RTP/AVP 0\r\n';
            const parsed = sdpTransform.parse(sdp);
            log('✅ SDP OK: ' + parsed.media[0].payloads);
        } catch (err) { log('❌ SDP: ' + err.message); }
        
        // Test Events
        try {
            const emitter = new EventEmitter();
            emitter.on('test', d => log('✅ Event: ' + d));
            emitter.emit('test', 'ESM OK!');
        } catch (err) { log('❌ Events: ' + err.message); }
        
        // Detect Device (no return)
        if (!detectDevice()) {
            log('❌ Browser không hỗ trợ');
            earlyExit = true;
        } else {
            log('✅ Browser OK');
        }
        
        if (earlyExit) {
            log('🚀 Polyfill OK - Bỏ Device.');
        }
        
        document.getElementById('startBtn').addEventListener('click', async () => {
            if (earlyExit) return;
            try {
                log('🔄 Load Device...');
                const caps = await new Promise((res, rej) => {
                    socket.emit('getRouterRtpCapabilities', data => res(data || { codecs: [], headerExtensions: [] }));
                    setTimeout(() => rej(new Error('Timeout')), 3000);
                });
                const device = new Device();
                await device.load({ routerRtpCapabilities: caps });
                log('✅ Device: ' + device.handlerName);
                
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true }).catch(e => { log('⚠️ Media: ' + e.message); return null; });
                if (stream) document.getElementById('localVideo').srcObject = stream;
            } catch (err) {
                log('❌ Load: ' + err.message);
                // Fake
                const fake = { codecs: [{ mimeType: 'audio/PCMU', kind: 'audio' }], headerExtensions: [] };
                const device = new Device();
                await device.load({ routerRtpCapabilities: fake });
                log('✅ Fake Device OK');
            }
        });
        
        socket.on('connect', () => log('✅ Socket OK'));
        log('🚀 Loaded - Check no errors!');
    </script>
</body>
</html>
